name: banner-fingerprint

services:
  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    image: banner-fingerprint/server:latest
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      RULES_PATH: /etc/bannerfp/rules.json
    volumes:
      - ./rules:/etc/bannerfp:ro
    ports:
      - "8080:8080"
    networks:
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/fpserver", "-selfcheck"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  client:
    build:
      context: .
      dockerfile: deploy/client.Dockerfile
    image: banner-fingerprint/client:latest
    restart: "no"
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_ADDR: http://server:8080
    command: ["-input", "/data/input.json"]
    volumes:
      - ./testdata:/data:ro
    networks:
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
